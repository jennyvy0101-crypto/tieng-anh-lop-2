        const shuffleArr = (arr) => [...arr].sort(() => Math.random() - 0.5);
        const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const keyRegex = (key) => new RegExp(`(^|[^A-Za-z-])(${escapeRe(key)})(?=$|[^A-Za-z-])`, 'i');
        const tokenizeSentence = (s) => s.replace(/[.!?,]/g, '').split(/\s+/).filter(Boolean);

        function HighlightKey({ text, keyWord }) {
          const m = text.match(keyRegex(keyWord));
          if (!m) return <span>{text}</span>;
          const start = m.index + m[1].length;
          const end = start + m[2].length;
          return (
            <span>
              {text.slice(0, start)}
              <span className="bg-amber-200 text-rose-700 px-1 rounded-md">{text.slice(start, end)}</span>
              {text.slice(end)}
            </span>
          );
        }

        function PatternPractice({ topic, speak, addStars, triggerFireworks }) {
          const data = PATTERN_PRACTICE[topic.id];
          const [mode, setMode] = useState('explore');
          const [order, setOrder] = useState([]);
          const [pos, setPos] = useState(0);
          const [status, setStatus] = useState(null); // 'correct' | 'wrong' | null
          const [missed, setMissed] = useState(false);
          const [options, setOptions] = useState([]);
          const [picked, setPicked] = useState([]);
          const [pool, setPool] = useState([]);
          const [score, setScore] = useState({ correct: 0, total: 0 });
          const [listeningIdx, setListeningIdx] = useState(null);
          const [speakResult, setSpeakResult] = useState({});
          const recRef = useRef(null);

          if (!data) return null;
          const drills = data.drills;
          const ROUND = Math.min(6, drills.length);

          const keysOfUnit = Array.from(new Set(drills.map(d => d.key.toLowerCase())));

          const buildQuestion = (m, drill) => {
            setStatus(null);
            setMissed(false);
            if (m === 'fill') {
              const others = shuffleArr(keysOfUnit.filter(k => k !== drill.key.toLowerCase())).slice(0, 2);
              setOptions(shuffleArr([drill.key.toLowerCase(), ...others]));
            } else if (m === 'order') {
              const toks = tokenizeSentence(drill.en).map((w, i) => ({ id: i, word: w }));
              let sh = shuffleArr(toks);
              if (toks.length > 1 && sh.every((t, i) => t.id === i)) sh = [...sh.slice(1), sh[0]];
              setPool(sh);
              setPicked([]);
            } else if (m === 'qa') {
              const answer = drill.a || drill.en;
              let wrong = drill.wrong;
              if (!wrong) {
                wrong = shuffleArr(Array.from(new Set(
                  drills.filter(d => d.key.toLowerCase() !== drill.key.toLowerCase()).map(d => d.a || d.en)
                ))).slice(0, 2);
              }
              setOptions(shuffleArr([answer, ...wrong.filter(w => w !== answer)]));
              if (drill.q) speak(drill.q);
            }
          };

          const startMode = (m) => {
            setMode(m);
            setScore({ correct: 0, total: 0 });
            setSpeakResult({});
            if (m === 'explore') return;
            const ord = shuffleArr(drills.map((_, i) => i)).slice(0, ROUND);
            setOrder(ord);
            setPos(0);
            buildQuestion(m, drills[ord[0]]);
          };

          const nextQuestion = () => {
            const next = pos + 1;
            setPos(next);
            if (next < order.length) buildQuestion(mode, drills[order[next]]);
          };

          const finished = mode !== 'explore' && pos >= order.length && order.length > 0;
          const current = mode !== 'explore' && !finished ? drills[order[pos]] : null;

          const markResult = (ok, sayText) => {
            if (status === 'correct') return;
            if (ok) {
              setStatus('correct');
              setScore(s => ({ correct: s.correct + (missed ? 0 : 1), total: s.total + 1 }));
              addStars(missed ? 1 : 3);
              speak(sayText);
              if (pos + 1 >= order.length) triggerFireworks();
            } else {
              setMissed(true);
              setStatus('wrong');
              speak("Try again!");
            }
          };

          // --- Nói theo (speech recognition) ---
          const startSpeak = (idx, target) => {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
              alert("Trình duyệt không hỗ trợ nhận diện giọng nói. Bé hãy bấm 🔊 và đọc to theo nhé!");
              return;
            }
            try { recRef.current && recRef.current.abort(); } catch (e) {}
            const rec = new SR();
            rec.lang = 'en-US';
            rec.continuous = false;
            rec.onresult = (e) => {
              const heard = e.results[0][0].transcript;
              const clean = (s) => s.toLowerCase().replace(/[^a-z0-9' ]/g, '').split(/\s+/).filter(Boolean);
              const t = clean(target);
              const u = clean(heard);
              const hit = t.filter(w => u.includes(w)).length;
              const ratio = Math.round((hit / t.length) * 100);
              const ok = ratio >= 60;
              setSpeakResult(r => ({ ...r, [idx]: { heard, ratio, ok } }));
              if (ok) { addStars(2); speak("Great job!"); } else { speak("Try again!"); }
            };
            rec.onerror = () => setListeningIdx(null);
            rec.onend = () => setListeningIdx(null);
            recRef.current = rec;
            setListeningIdx(idx);
            try { rec.start(); } catch (e) { setListeningIdx(null); }
          };

          const MODES = [
            { id: 'explore', label: '🔁 Thay Từ & Nói Theo', color: 'bg-indigo-600' },
            { id: 'fill', label: '🧩 Điền Từ Vào Câu', color: 'bg-emerald-600' },
            { id: 'order', label: '🔀 Sắp Xếp Câu', color: 'bg-blue-600' },
            { id: 'qa', label: '💬 Nhìn Hình – Hỏi Đáp', color: 'bg-rose-500' }
          ];

          const renderFill = (d) => {
            const m = d.en.match(keyRegex(d.key));
            const start = m ? m.index + m[1].length : 0;
            const end = m ? start + m[2].length : 0;
            return (
              <div className="space-y-4">
                <div className="text-6xl">{d.icon}</div>
                <p className="text-xs font-bold text-slate-500">👉 {d.vn}</p>
                <p className="text-xl font-black text-indigo-950">
                  {d.en.slice(0, start)}
                  <span className={`inline-block min-w-[80px] border-b-4 mx-1 px-2 ${status === 'correct' ? 'border-emerald-500 text-emerald-600' : 'border-indigo-400 text-transparent'}`}>
                    {status === 'correct' ? d.en.slice(start, end) : '____'}
                  </span>
                  {d.en.slice(end)}
                </p>
                <div className="flex flex-wrap justify-center gap-3">
                  {options.map(opt => (
                    <button key={opt} onClick={() => markResult(opt === d.key.toLowerCase(), d.en)}
                      className="bg-white border-2 border-emerald-300 hover:border-amber-400 px-5 py-2.5 rounded-2xl font-black text-indigo-950 shadow">
                      {opt}
                    </button>
                  ))}
                </div>
              </div>
            );
          };

          const renderOrder = (d) => {
            const target = tokenizeSentence(d.en).join(' ');
            const pick = (w) => {
              if (status === 'correct') return;
              const nextPicked = [...picked, w];
              const nextPool = pool.filter(p => p.id !== w.id);
              setPicked(nextPicked);
              setPool(nextPool);
              if (nextPool.length === 0) markResult(nextPicked.map(p => p.word).join(' ') === target, d.en);
            };
            const unpick = (w) => {
              if (status === 'correct') return;
              setPicked(picked.filter(p => p.id !== w.id));
              setPool([...pool, w]);
              setStatus(null);
            };
            return (
              <div className="space-y-4">
                <div className="text-5xl">{d.icon}</div>
                <div className="bg-white p-3 rounded-2xl border border-blue-200">
                  <p className="text-xs text-blue-600 font-bold">Nghĩa tiếng Việt:</p>
                  <h5 className="font-black text-indigo-950">"{d.vn}"</h5>
                  <button onClick={() => speak(d.en)} className="mt-1 bg-amber-400 text-indigo-950 px-3 py-1 rounded-lg text-xs font-black">🔊 Nghe gợi ý</button>
                </div>
                <div className="min-h-[60px] bg-white p-3 rounded-2xl border-2 border-dashed border-blue-400 flex flex-wrap items-center justify-center gap-2">
                  {picked.length === 0 && <span className="text-xs text-slate-400">Chạm các từ bên dưới theo đúng thứ tự...</span>}
                  {picked.map(w => (
                    <button key={w.id} onClick={() => unpick(w)} className="bg-amber-400 text-indigo-950 font-black px-3 py-1.5 rounded-xl text-sm shadow">{w.word}</button>
                  ))}
                </div>
                <div className="flex flex-wrap justify-center gap-2">
                  {pool.map(w => (
                    <button key={w.id} onClick={() => pick(w)} className="bg-blue-600 text-white font-black px-3.5 py-2 rounded-xl text-sm shadow">{w.word}</button>
                  ))}
                </div>
                {status === 'wrong' && <p className="text-[11px] font-bold text-slate-500">Chạm vào từ ở ô trên để gỡ ra và xếp lại nhé.</p>}
              </div>
            );
          };

          const renderQa = (d) => (
            <div className="space-y-4">
              <div className="text-6xl">{d.icon}</div>
              <p className="text-xs font-bold text-slate-500">🖼️ Hình: {d.vn}</p>
              {d.q ? (
                <div className="bg-indigo-600 text-white p-3 rounded-2xl inline-block">
                  <p className="text-lg font-black">{d.q}</p>
                  <p className="text-[11px] text-indigo-100">{d.qVn}</p>
                  <button onClick={() => speak(d.q)} className="mt-1 bg-indigo-500 px-3 py-1 rounded-lg text-xs font-bold">🔊 Nghe câu hỏi</button>
                </div>
              ) : (
                <p className="font-black text-indigo-950">Câu nào đúng với bức hình?</p>
              )}
              <div className="grid gap-2 max-w-sm mx-auto">
                {options.map(opt => {
                  const answer = d.a || d.en;
                  const isAns = opt === answer;
                  return (
                    <button key={opt} onClick={() => markResult(isAns, answer)}
                      className={`text-left px-4 py-3 rounded-2xl font-black text-sm border-2 shadow transition-all ${
                        status === 'correct' && isAns ? 'bg-emerald-500 text-white border-emerald-600' : 'bg-white text-indigo-950 border-rose-200 hover:border-amber-400'
                      }`}>
                      💬 {opt}
                    </button>
                  );
                })}
              </div>
              {status === 'correct' && d.a && (
                <p className="text-xs font-bold text-emerald-700">✅ {d.a} ({d.aVn}) — {d.en}</p>
              )}
            </div>
          );

          return (
            <div className="space-y-5">
              <div className="bg-gradient-to-r from-indigo-50 to-sky-50 p-4 rounded-2xl border-2 border-indigo-200">
                <span className="bg-indigo-600 text-white px-3 py-1 rounded-full text-[11px] font-black">🧱 Khung mẫu câu</span>
                <p className="text-lg sm:text-xl font-black text-indigo-950 mt-2">{data.frame}</p>
                <p className="text-xs font-bold text-slate-600 mt-1">💡 {data.tip}</p>
              </div>

              <div className="flex flex-wrap gap-2">
                {MODES.map(m => (
                  <button key={m.id} onClick={() => startMode(m.id)}
                    className={`px-3 py-2 rounded-xl text-xs font-black transition-all ${mode === m.id ? `${m.color} text-white shadow scale-105` : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>

              {mode === 'explore' && (
                <div className="space-y-3">

                        <div className="text-3xl w-16 text-center shrink-0">{d.icon}</div>
                        <div className="flex-1 min-w-0 space-y-1">
                          {d.q && <p className="text-[11px] font-bold text-indigo-600">❓ {d.q}</p>}
                          {d.a && <p className="text-[11px] font-black text-emerald-700">💬 {d.a} <span className="font-bold text-slate-500">({d.aVn})</span></p>}
                          <p className="font-black text-indigo-950 text-sm"><HighlightKey text={d.en} keyWord={d.key} /></p>
                          <p className="text-[11px] font-bold text-slate-500">{d.vn}</p>
                          <div className="flex gap-2 pt-1">
                            <button onClick={() => speak(d.q ? `${d.q} ${d.a ? d.a + ' ' + d.en : d.en}` : d.en)} className="bg-amber-400 hover:bg-amber-500 text-indigo-950 px-2.5 py-1 rounded-lg font-black text-[11px] shadow">🔊 Nghe</button>
                            <button onClick={() => startSpeak(idx, d.en)} className={`px-2.5 py-1 rounded-lg font-black text-[11px] shadow text-white ${listeningIdx === idx ? 'bg-rose-600 animate-pulse' : 'bg-indigo-600 hover:bg-indigo-700'}`}>
                              {listeningIdx === idx ? '🎙️ Đang nghe...' : '🎤 Nói theo'}
                            </button>
                          </div>
                          {speakResult[idx] && (
                            <p className={`text-[11px] font-black ${speakResult[idx].ok ? 'text-emerald-600' : 'text-rose-600'}`}>
                              {speakResult[idx].ok ? '🎉 Giỏi lắm! +2 ⭐' : '💪 Thử lại nhé!'} (Bé nói: "{speakResult[idx].heard}")
                            </p>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="text-center">
                    <button onClick={() => startMode('fill')} className="bg-emerald-600 text-white font-black px-4 py-2 rounded-xl text-xs shadow">Bắt đầu luyện tập ➡️</button>
                  </div>
                </div>
              )}

              {mode !== 'explore' && (
                <div className="bg-slate-50 p-5 rounded-3xl border-2 border-slate-200 text-center space-y-4">
                  <div className="flex items-center justify-between text-xs font-black text-slate-600">
                    <span>Câu {Math.min(pos + 1, order.length)}/{order.length}</span>
                    <span>✅ Đúng ngay lần đầu: {score.correct}</span>
                  </div>
                  <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                    <div className="bg-emerald-500 h-2 transition-all" style={{ width: `${(Math.min(pos + (status === 'correct' ? 1 : 0), order.length) / Math.max(order.length, 1)) * 100}%` }}></div>
                  </div>

                  {finished ? (
                    <div className="space-y-3 py-4">
                      <div className="text-6xl">{score.correct === order.length ? '🏆' : score.correct >= order.length / 2 ? '🌟' : '💪'}</div>
                      <p className="text-lg font-black text-indigo-950">Hoàn thành! Bé làm đúng ngay {score.correct}/{order.length} câu.</p>
                      <p className="text-xs font-bold text-slate-500">
                        {score.correct === order.length ? 'Xuất sắc! Bé đã thuộc mẫu câu rồi!' : 'Luyện thêm một lượt nữa để nhớ lâu hơn nhé!'}
                      </p>
                      <div className="flex flex-wrap justify-center gap-2">
                        <button onClick={() => startMode(mode)} className="bg-indigo-600 text-white font-black px-4 py-2 rounded-xl text-xs">🔄 Làm lại</button>
                        {MODES.filter(m => m.id !== mode && m.id !== 'explore').map(m => (
                          <button key={m.id} onClick={() => startMode(m.id)} className={`${m.color} text-white font-black px-4 py-2 rounded-xl text-xs`}>{m.label}</button>
                        ))}
                      </div>
                    </div>
                  ) : current && (
                    <>
                      {mode === 'fill' && renderFill(current)}
                      {mode === 'order' && renderOrder(current)}
                      {mode === 'qa' && renderQa(current)}

                      {status === 'correct' && (
                        <div className="space-y-2">
                          <p className="bg-emerald-500 text-white p-2 rounded-xl font-black text-xs">🎉 Chính xác! "{current.en}"</p>
                          <button onClick={nextQuestion} className="bg-indigo-600 text-white font-black px-4 py-2 rounded-xl text-xs">
                            {pos + 1 >= order.length ? 'Xem kết quả 🏁' : 'Câu tiếp theo ➡️'}
                          </button>
                        </div>
                      )}
                      {status === 'wrong' && <p className="bg-rose-500 text-white p-2 rounded-xl font-black text-xs">❌ Chưa đúng rồi, bé thử lại nhé!</p>}
                    </>
                  )}
                </div>
              )}
            </div>
          );
        }


        function App() {
          const [stars, setStars] = useState(() => parseInt(localStorage.getItem('gs_stars_v3') || '60'));
          const [selectedTopicIdx, setSelectedTopicIdx] = useState(0);
          const [activeTab, setActiveTab] = useState('lesson');
          const [activeGameType, setActiveGameType] = useState('bubble');
          const [isSlowSpeech, setIsSlowSpeech] = useState(false);

          // Dialogue Mic
          const [isListening, setIsListening] = useState(false);
          const [transcript, setTranscript] = useState('');
          const [speechScore, setSpeechScore] = useState(null);
          const recognitionRef = useRef(null);

          // Mini Games states
          const [bubbleScore, setBubbleScore] = useState(0);
          const [floatingBubbles, setFloatingBubbles] = useState([]);
          const [bubbleTarget, setBubbleTarget] = useState(null);
          const [bubbleMsg, setBubbleMsg] = useState('');

          const [memoryCards, setMemoryCards] = useState([]);
          const [flippedIndices, setFlippedIndices] = useState([]);
          const [matchedIds, setMatchedIds] = useState([]);

          const [spellingIdx, setSpellingIdx] = useState(0);
          const [userTypedWord, setUserTypedWord] = useState('');
          const [spellingResult, setSpellingResult] = useState(null);

          const [builderIdx, setBuilderIdx] = useState(0);
          const [selectedBuilderWords, setSelectedBuilderWords] = useState([]);
          const [availableBuilderWords, setAvailableBuilderWords] = useState([]);
          const [builderSuccess, setBuilderSuccess] = useState(false);

          const [audioQuizIdx, setAudioQuizIdx] = useState(0);
          const [audioQuizCorrect, setAudioQuizCorrect] = useState(null);
          const [audioQuizOptions, setAudioQuizOptions] = useState([]);
          const [audioQuizStatus, setAudioQuizStatus] = useState(null);

          const [rocketTarget, setRocketTarget] = useState(null);
          const [rocketOptions, setRocketOptions] = useState([]);
          const [rocketTimer, setRocketTimer] = useState(10);
          const [rocketLaunched, setRocketLaunched] = useState(false);
          const [rocketStatus, setRocketStatus] = useState(null);
          const rocketTimerRef = useRef(null);

          const [frogPosition, setFrogPosition] = useState(0);
          const [frogQuestion, setFrogQuestion] = useState(null);
          const [frogOptions, setFrogOptions] = useState([]);
          const [frogStatus, setFrogStatus] = useState(null);

          // Review Test state
          const [reviewSubmitted, setReviewSubmitted] = useState(false);
          const [userAnswers, setUserAnswers] = useState({});
          const [reviewScore, setReviewScore] = useState(0);

          const currentTopic = GLOBAL_SUCCESS_TOPICS[selectedTopicIdx];

          const addStars = (amount) => {
            setStars(prev => {
              const next = prev + amount;
              localStorage.setItem('gs_stars_v3', next.toString());
              return next;
            });
          };

          const triggerFireworks = () => {
            try {
              confetti({ particleCount: 75, spread: 70, origin: { y: 0.6 } });
            } catch (e) {}
          };

          const speak = (text) => {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = isSlowSpeech ? 0.6 : 0.95;
            window.speechSynthesis.speak(utterance);
          };

          useEffect(() => {
            if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
              const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
              recognitionRef.current = new SpeechRecognition();
              recognitionRef.current.continuous = false;
              recognitionRef.current.lang = 'en-US';
              recognitionRef.current.onresult = (e) => {
                const text = e.results[0][0].transcript;
                setTranscript(text);
                setIsListening(false);
                checkSpeechTarget(text, currentTopic.dialogue.steps[0].targetPhrase);
              };
              recognitionRef.current.onerror = () => setIsListening(false);
              recognitionRef.current.onend = () => setIsListening(false);
            }
          }, [selectedTopicIdx]);

          const toggleListen = () => {
            if (!recognitionRef.current) {
              alert("Trình duyệt không hỗ trợ nhận diện giọng nói. Bé có thể bấm gợi ý bên dưới!");
              return;
            }
            if (isListening) {
              recognitionRef.current.stop();
              setIsListening(false);
            } else {
              setTranscript('');
              setSpeechScore(null);
              setIsListening(true);
              try { recognitionRef.current.start(); } catch (e) { setIsListening(false); }
            }
          };

          const checkSpeechTarget = (user, target) => {
            const cleanT = target.toLowerCase().replace(/[^a-z0-9 ]/g, '');
            const cleanU = user.toLowerCase().replace(/[^a-z0-9 ]/g, '');
            const tWords = cleanT.split(' ');
            const uWords = cleanU.split(' ');
            let match = 0;
            tWords.forEach(w => { if (uWords.includes(w)) match++; });
            const ratio = Math.round((match / tWords.length) * 100);
            if (ratio >= 40 || cleanU.includes(cleanT)) {
              setSpeechScore({ msg: "🎉 Phát âm chính xác! Xuất sắc lắm!", success: true });
              addStars(5);
              triggerFireworks();
              speak("Great job!");
            } else {
              setSpeechScore({ msg: "💪 Thử phát âm lại theo giọng mẫu nhé!", success: false });
              speak("Try again!");
            }
          };

          const initBubbleGame = () => {
            const vocab = currentTopic.vocab;
            const target = vocab[Math.floor(Math.random() * vocab.length)];
            setBubbleTarget(target);
            speak("Pop bubble: " + target.word);
            const shuffled = [...vocab].sort(() => Math.random() - 0.5).slice(0, 4);
            if (!shuffled.some(s => s.id === target.id)) shuffled[0] = target;
            setFloatingBubbles(shuffled.sort(() => Math.random() - 0.5));
            setBubbleMsg('');
          };

          const handlePop = (item) => {
            if (item.id === bubbleTarget.id) {
              setBubbleMsg("🎈 Chính xác! Bong bóng nổ tung!");
              setBubbleScore(s => s + 1);
              addStars(3);
              triggerFireworks();
              speak("Correct pop!");
              setTimeout(initBubbleGame, 1200);
            } else {
              setBubbleMsg("❌ Không phải bong bóng này, thử lại nhé!");
              speak("Try again!");
            }
          };

          const initRocketGame = () => {
            if (rocketTimerRef.current) clearInterval(rocketTimerRef.current);
            const vocab = currentTopic.vocab;
            const target = vocab[Math.floor(Math.random() * vocab.length)];
            setRocketTarget(target);
            const others = vocab.filter(v => v.id !== target.id).sort(() => Math.random() - 0.5).slice(0, 2);
            setRocketOptions([target, ...others].sort(() => Math.random() - 0.5));
            setRocketTimer(10);
            setRocketLaunched(false);
            setRocketStatus(null);
            speak("Fuel rocket with: " + target.word);

            rocketTimerRef.current = setInterval(() => {
              setRocketTimer(prev => {
                if (prev <= 1) {
                  clearInterval(rocketTimerRef.current);
                  setRocketStatus('timeout');
                  speak("Time is up!");
                  return 0;
                }
                return prev - 1;
              });
            }, 1000);
          };

          const handleRocket = (id) => {
            if (rocketTimerRef.current) clearInterval(rocketTimerRef.current);
            if (id === rocketTarget.id) {
              setRocketLaunched(true);
              setRocketStatus('success');
              addStars(5);
              triggerFireworks();
              speak("Rocket launched successfully!");
            } else {
              setRocketStatus('failed');
              speak("Wrong fuel!");
            }
          };

          const initFrogGame = (pos = 0) => {
            setFrogPosition(pos);
            setFrogStatus(null);
            const quizList = currentTopic.sentenceQuiz || [];
            const quiz = quizList[pos % quizList.length] || { fullSentence: currentTopic.lesson.sampleSentences[0].en, vn: currentTopic.lesson.sampleSentences[0].vn };
            const words = quiz.fullSentence.split(' ');
            const mIdx = Math.floor(Math.random() * words.length);
            const target = words[mIdx];
            const display = words.map((w, i) => i === mIdx ? '______' : w).join(' ');
            const vocabWords = currentTopic.vocab.map(v => v.word);
            const dist = vocabWords.filter(w => w.toLowerCase() !== target.toLowerCase()).sort(() => Math.random() - 0.5).slice(0, 2);
            setFrogQuestion({ display, target, vn: quiz.vn });
            setFrogOptions([target, ...dist].sort(() => Math.random() - 0.5));
            speak(quiz.fullSentence);
          };

          const handleFrog = (opt) => {
            if (opt.toLowerCase() === frogQuestion.target.toLowerCase()) {
              const next = frogPosition + 1;
              setFrogPosition(next);
              setFrogStatus('correct');
              addStars(4);
              speak("Ribbit! Correct!");
              if (next >= 4) {
                triggerFireworks();
                speak("Froggy reached the trophy!");
              } else {
                setTimeout(() => initFrogGame(next), 1000);
              }
            } else {
              setFrogStatus('wrong');
              speak("Oops! Try again!");
            }
          };

          const initMemoryGame = () => {
            const vocab = currentTopic.vocab.slice(0, 4);
            const deck = [];
            vocab.forEach(v => {
              deck.push({ id: v.id + '_img', vocabId: v.id, type: 'img', content: v.icon, label: v.vn });
              deck.push({ id: v.id + '_txt', vocabId: v.id, type: 'txt', content: v.word, label: v.word });
            });
            deck.sort(() => Math.random() - 0.5);
            setMemoryCards(deck);
            setFlippedIndices([]);
            setMatchedIds([]);
          };

          const handleCardClick = (idx) => {
            if (flippedIndices.length === 2 || flippedIndices.includes(idx) || matchedIds.includes(memoryCards[idx].vocabId)) return;
            const nextFlipped = [...flippedIndices, idx];
            setFlippedIndices(nextFlipped);
            if (memoryCards[idx].type === 'txt') speak(memoryCards[idx].content);

            if (nextFlipped.length === 2) {
              const c1 = memoryCards[nextFlipped[0]];
              const c2 = memoryCards[nextFlipped[1]];
              if (c1.vocabId === c2.vocabId) {
                setMatchedIds(prev => [...prev, c1.vocabId]);
                setFlippedIndices([]);
                addStars(3);
                speak("Great match!");
                if (matchedIds.length + 1 === 4) triggerFireworks();
              } else {
                setTimeout(() => setFlippedIndices([]), 1000);
              }
            }
          };

          const initSpellingGame = (idx = 0) => {
            const v = currentTopic.vocab[idx % currentTopic.vocab.length];
            setSpellingIdx(idx);
            setUserTypedWord('');
            setSpellingResult(null);
            speak(v.word);
          };

          const checkSpelling = () => {
            const v = currentTopic.vocab[spellingIdx % currentTopic.vocab.length];
            if (userTypedWord.trim().toLowerCase() === v.word.toLowerCase()) {
              setSpellingResult({ success: true, msg: "🎉 Chính xác tuyệt vời!" });
              addStars(5);
              triggerFireworks();
              speak("Correct!");
            } else {
              setSpellingResult({ success: false, msg: `❌ Chưa đúng. Đáp án: ${v.word}` });
              speak("Try again!");
            }
          };

          const initSentenceBuilder = (idx = 0) => {
            setBuilderIdx(idx);
            const quizList = currentTopic.sentenceQuiz || [];
            if (!quizList[idx]) return;
            const data = quizList[idx];
            const shuffled = [...data.words].sort(() => Math.random() - 0.5);
            setAvailableBuilderWords(shuffled.map((w, i) => ({ id: i, word: w })));
            setSelectedBuilderWords([]);
            setBuilderSuccess(false);
            speak(data.fullSentence);
          };

          const handlePickBuilderWord = (wObj) => {
            if (builderSuccess) return;
            const nextSel = [...selectedBuilderWords, wObj];
            setSelectedBuilderWords(nextSel);
            setAvailableBuilderWords(prev => prev.filter(w => w.id !== wObj.id));

            const cur = nextSel.map(w => w.word).join(' ');
            const target = (currentTopic.sentenceQuiz[builderIdx] || {}).fullSentence;
            if (cur === target) {
              setBuilderSuccess(true);
              addStars(5);
              triggerFireworks();
              speak("Wonderful sentence!");
            }
          };

          const initAudioQuiz = (idx = 0) => {
            setAudioQuizIdx(idx);
            const vocab = currentTopic.vocab;
            const correct = vocab[idx % vocab.length];
            setAudioQuizCorrect(correct);
            const others = vocab.filter(v => v.id !== correct.id).sort(() => Math.random() - 0.5).slice(0, 2);
            setAudioQuizOptions([correct, ...others].sort(() => Math.random() - 0.5));
            setAudioQuizStatus(null);
            speak(correct.word);
          };

          const handleAudioQuizSelect = (opt) => {
            if (opt.id === audioQuizCorrect.id) {
              setAudioQuizStatus('correct');
              addStars(5);
              triggerFireworks();
              speak("Correct!");
            } else {
              setAudioQuizStatus('wrong');
              speak("Oops! Try again!");
            }
          };

          useEffect(() => {
            if (activeTab === 'games') {
              if (activeGameType === 'bubble') initBubbleGame();
              if (activeGameType === 'rocket') initRocketGame();
              if (activeGameType === 'frog') initFrogGame(0);
              if (activeGameType === 'memory') initMemoryGame();
              if (activeGameType === 'spelling') initSpellingGame(0);
              if (activeGameType === 'builder') initSentenceBuilder(0);
              if (activeGameType === 'audioquiz') initAudioQuiz(0);
            }
          }, [activeTab, activeGameType, selectedTopicIdx]);

          return (
            <div className="min-h-screen bg-sky-100 font-sans pb-16">
              {/* HEADER */}
              <header className="bg-white border-b-4 border-sky-300 shadow-md sticky top-0 z-50 px-4 py-3">
                <div className="max-w-6xl mx-auto flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 bg-amber-400 rounded-2xl flex items-center justify-center text-2xl shadow border-2 border-amber-500">
                      🎒
                    </div>
                    <div>
                      <h1 className="text-xl font-black text-indigo-950">KIDS ENGLISH EXPLORER</h1>
                      <p className="text-xs font-bold text-sky-600">Global Success Grade 2 • 16 Units</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 bg-amber-100 border-2 border-amber-300 px-4 py-1.5 rounded-2xl shadow-sm">
                    <span className="text-xl">⭐</span>
                    <span className="font-black text-amber-950 text-sm">{stars} Sao</span>
                  </div>
                </div>
              </header>

              {/* MAIN BODY */}
              <main className="max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 md:grid-cols-4 gap-6">
                
                {/* SIDEBAR UNITS */}
                <div className="md:col-span-1 space-y-2">
                  <h3 className="font-black text-xs text-indigo-900 uppercase tracking-wider px-1">
                    📚 Danh Sách Các Unit (1-16)
                  </h3>
                  <div className="space-y-2 max-h-[75vh] overflow-y-auto pr-1">
                    {GLOBAL_SUCCESS_TOPICS.map((topic, idx) => (
                      <button
                        key={topic.id}
                        onClick={() => {
                          setSelectedTopicIdx(idx);
                          setActiveTab('lesson');
                        }}
                        className={`w-full text-left p-3 rounded-2xl border-3 transition-all flex items-center gap-3 ${
                          selectedTopicIdx === idx
                            ? `bg-white ${topic.borderColor} shadow-lg ring-2 ring-indigo-400 scale-102`
                            : 'bg-white/70 border-slate-200 hover:bg-white'
                        }`}
                      >
                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-xl bg-gradient-to-br ${topic.color} text-white shadow`}>
                          {topic.icon}
                        </div>
                        <div className="flex-1 overflow-hidden">
                          <p className="font-black text-xs text-slate-800 truncate">{topic.title}</p>
                          <p className="text-[11px] font-bold text-slate-500 truncate">{topic.subtitle}</p>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* CONTENT AREA */}
                <div className="md:col-span-3 space-y-6">
                  
                  {/* TOPIC BANNER */}
                  <div className={`bg-gradient-to-r ${currentTopic.color} text-white p-6 rounded-3xl shadow-xl flex items-center justify-between`}>
                    <div>
                      <span className="bg-white/20 px-3 py-1 rounded-full text-xs font-black">{currentTopic.subtitle}</span>
                      <h2 className="text-2xl sm:text-3xl font-black mt-2">{currentTopic.title}</h2>
                      <p className="text-xs font-bold text-white/90 mt-1">{currentTopic.lesson.summary}</p>
                    </div>
                    <div className="text-6xl">{currentTopic.icon}</div>
                  </div>

                  {/* TABS CONTAINER */}
                  <div className="bg-white rounded-3xl p-5 shadow-lg border-2 border-sky-200 space-y-6">
                    
                    {/* TAB NAV */}
                    <div className="flex border-b-2 border-slate-100 pb-3 gap-2 overflow-x-auto items-center">
                      {[
                        { id: 'lesson', label: '📖 Bài Học', color: 'bg-indigo-600' },
                        { id: 'patterns', label: '✍️ Luyện Mẫu Câu', color: 'bg-fuchsia-600' },
                        { id: 'vocab', label: '🗂️ Từ Vựng', color: 'bg-emerald-600' },
                        { id: 'dialogue', label: '💬 Đối Thoại', color: 'bg-amber-500' },
                        { id: 'games', label: '🎮 7 Mini Games', color: 'bg-rose-500' },
                        ...((selectedTopicIdx + 1) % 2 === 0 ? [{ id: 'review_test', label: `🏆 Kiểm Tra Review 1-${selectedTopicIdx + 1}`, color: 'bg-purple-600 animate-pulse' }] : [])
                      ].map(tab => (
                        <button
                          key={tab.id}
                          onClick={() => {
                            setActiveTab(tab.id);
                            if (tab.id === 'review_test') {
                              setReviewSubmitted(false);
                              setUserAnswers({});
                            }
                          }}
                          className={`px-4 py-2.5 rounded-2xl font-black text-xs sm:text-sm transition-all whitespace-nowrap ${
                            activeTab === tab.id ? `${tab.color} text-white shadow-md scale-105` : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                          }`}

                          return (
                            <div className="space-y-5">
                              {!reviewSubmitted ? (
                                <div className="space-y-5">
                                  {reviewQuizList.map(q => (
                                    <div key={q.id} className="bg-white p-4 rounded-2xl border border-purple-200 space-y-2">
                                      <p className="font-black text-indigo-950 text-sm">{q.question}</p>
                                      {q.id === 'rq1' && (
                                        <button onClick={() => speak(q.target.word)} className="bg-amber-400 text-indigo-950 px-3 py-1 rounded-xl font-black text-xs">🔊 Bấm nghe từ</button>
                                      )}
                                      <div className="grid grid-cols-3 gap-2 pt-2">
                                        {q.options.map((opt, i) => {
                                          const val = q.id === 'rq1' ? opt.id : opt;
                                          const isSel = userAnswers[q.id] === val;
                                          return (
                                            <button
                                              key={i}
                                              onClick={() => setUserAnswers(prev => ({ ...prev, [q.id]: val }))}
                                              className={`p-3 rounded-xl border font-black text-xs flex flex-col items-center ${isSel ? 'bg-purple-600 text-white border-purple-800 shadow' : 'bg-slate-50 text-slate-700'}`}
                                            >
                                              {q.id === 'rq1' ? <span className="text-3xl">{opt.icon}</span> : <span>{opt}</span>}
                                            </button>
                                          );
                                        })}
                                      </div>
                                    </div>
                                  ))}
                                  <div className="text-center pt-2">
                                    <button onClick={handleReviewSubmit} className="bg-purple-600 text-white font-black px-8 py-3 rounded-2xl text-xs shadow-lg">Nộp Bài & Nhận +15 Sao 🏁</button>
                                  </div>
                                </div>
                              ) : (
                                <div className="bg-white p-6 rounded-3xl text-center space-y-3">
                                  <div className="text-5xl">👑</div>
                                  <h4 className="text-xl font-black text-indigo-950">Kết Quả Review: {reviewScore}/3 Câu Đúng</h4>
                                  {reviewScore >= 2 && <p className="text-xs font-black text-amber-600 bg-amber-50 p-2 rounded-xl">🎉 Thưởng +15 Sao Vàng ⭐ thành công!</p>}
                                  <button onClick={() => { setReviewSubmitted(false); setUserAnswers({}); }} className="bg-purple-600 text-white font-black px-5 py-2 rounded-xl text-xs">Làm Lại 🔄</button>
                                </div>
                              )}
                            </div>
                          );
                        })()}
                      </div>
                    )}

                  </div>

                </div>

              </main>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
