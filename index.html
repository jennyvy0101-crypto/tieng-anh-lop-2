<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids English Explorer - Global Success Grade 2</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Tùy chỉnh thanh cuộn bên trong khung điện thoại */
        .phone-screen::-webkit-scrollbar {
            width: 5px;
        }
        .phone-screen::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .phone-screen::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .phone-screen::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-slate-900 to-sky-900 min-h-screen flex flex-col items-center justify-center p-0 sm:p-4 text-slate-800">

    <!-- THANH ĐIỀU KHIỂN CHẾ ĐỘ XEM (PC / MOBILE FRAME) -->
    <div class="hidden sm:flex items-center gap-4 mb-4 bg-slate-800/80 backdrop-blur px-5 py-2.5 rounded-full shadow-lg border border-slate-700 text-white text-sm">
        <span class="font-semibold flex items-center gap-2">📱 Trình mô phỏng thiết bị:</span>
        <button id="btnFrame" onclick="toggleFrame()" class="bg-sky-500 hover:bg-sky-600 text-white px-4 py-1.5 rounded-full font-medium transition shadow">
            Tắt/Bật Khung Điện Thoại
        </button>
    </div>

    <!-- KHUNG ĐIỆN THOẠI (PHONE CONTAINER) -->
    <div id="deviceWrapper" class="w-full sm:w-[414px] sm:h-[845px] bg-slate-950 sm:rounded-[50px] sm:p-3 sm:shadow-2xl sm:border-[8px] sm:border-slate-800 flex flex-col relative transition-all duration-300">
        
        <!-- Tai thỏ / Dynamic Island (Chỉ hiển thị trên khung điện thoại) -->
        <div class="hidden sm:flex absolute top-3 left-1/2 -translate-x-1/2 w-32 h-6 bg-slate-940 rounded-full z-50 items-center justify-center pointer-events-none">
            <div class="w-3 h-3 bg-black rounded-full mr-2"></div>
            <div class="w-12 h-1.5 bg-slate-800 rounded-full"></div>
        </div>

        <!-- MÀN HÌNH ỨNG DỤNG BÊN TRONG -->
        <div class="phone-screen w-full h-full bg-sky-100 sm:rounded-[40px] overflow-y-auto overflow-x-hidden relative flex flex-col">
            <div id="root" class="w-full min-h-full flex flex-col"></div>
        </div>
    </div>

    <!-- SCRIPT ĐIỀU KHIỂN GIAO DIỆN KHUNG -->
    <script>
        function toggleFrame() {
            const wrapper = document.getElementById('deviceWrapper');
            if (wrapper.classList.contains('sm:w-[414px]')) {
                wrapper.classList.remove('sm:w-[414px]', 'sm:h-[845px]', 'sm:rounded-[50px]', 'sm:p-3', 'sm:shadow-2xl', 'sm:border-[8px]', 'sm:border-slate-800');
                wrapper.classList.add('w-full', 'min-h-screen', 'rounded-none', 'border-none');
            } else {
                wrapper.classList.add('sm:w-[414px]', 'sm:h-[845px]', 'sm:rounded-[50px]', 'sm:p-3', 'sm:shadow-2xl', 'sm:border-[8px]', 'sm:border-slate-800');
                wrapper.classList.remove('w-full', 'min-h-screen', 'rounded-none', 'border-none');
            }
        }
    </script>

    <!-- REACT APP CODE -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // --- GLOBAL SUCCESS GRADE 2 CURRICULUM TOPICS (OFFICIAL BOOK MAP) ---        
        const GLOBAL_SUCCESS_TOPICS = [          
          {            
            id: 'gs_u1',            
            title: 'Unit 1: At My Birthday Party',            
            subtitle: 'Bữa Tiệc Sinh Nhật 🎉',            
            icon: '🎂',            
            color: 'from-pink-500 to-rose-600',            
            borderColor: 'border-pink-300',            
            lesson: {              
              summary: "Phonics: p | Từ vựng: pasta, popcorn, pizza | Mẫu câu: The popcorn is yummy.",              
              keyGrammar: "The popcorn is yummy.",              
              sampleSentences: [                
                { en: "The popcorn is yummy.", vn: "Bỏng ngô rất ngon.", audio: "The popcorn is yummy." },                
                { en: "I like pizza and pasta.", vn: "Tớ thích pizza và mì ống.", audio: "I like pizza and pasta." }              ]            
            },            
            vocab: [              
              { id: 'u1_1', word: 'Pasta', sound: '/ˈpæstə/', vn: 'Mì ống', icon: '🍝' },              
              { id: 'u1_2', word: 'Popcorn', sound: '/ˈpɒpkɔːrn/', vn: 'Bỏng ngô', icon: '🍿' },              
              { id: 'u1_3', word: 'Pizza', sound: '/ˈpiːtsə/', vn: 'Bánh pizza', icon: '🍕' }            ],            
            dialogue: {              
              avatar: '🎂',              
              title: 'Bữa Tiệc Sinh Nhật',              
              steps: [                
                {                  
                  botText: "Do you like the popcorn?",                  
                  botVn: "Bé có thích bỏng ngô không?",                  
                  targetPhrase: "Yes the popcorn is yummy",                  
                  targetVn: "Có, bỏng ngô rất ngon!"                }              ]            },            
            sentenceQuiz: [              
              { id: 'sq1', fullSentence: "The popcorn is yummy", vn: "Bỏng ngô rất ngon", words: ["The", "popcorn", "is", "yummy"] }            ]          },          
          {            
            id: 'gs_u2',            
            title: 'Unit 2: In The Backyard',            
            subtitle: 'Khu Vườn Sau Nhà 🌳',            
            icon: '🏡',            
            color: 'from-emerald-500 to-teal-700',            
            borderColor: 'border-emerald-300',            
            lesson: {              
              summary: "Phonics: k | Từ vựng: kite, bike, kitten | Mẫu câu: Is she flying a kite? - Yes, she is. / No, she isn't.",              
              keyGrammar: "Is she flying a kite? - Yes, she is. / No, she isn't.",              
              sampleSentences: [                
                { en: "Is she flying a kite?", vn: "Cậu ấy đang thả diều phải không?", audio: "Is she flying a kite?" },                
                { en: "Yes, she is. No, she isn't.", vn: "Đúng vậy. / Không phải.", audio: "Yes, she is. No, she isn't." }              ]            },            
            vocab: [              
              { id: 'u2_1', word: 'Kite', sound: '/kaɪt/', vn: 'Cái diều', icon: '🪁' },              
              { id: 'u2_2', word: 'Bike', sound: '/baɪk/', vn: 'Xe đạp', icon: '🚲' },              
              { id: 'u2_3', word: 'Kitten', sound: '/ˈkɪtn/', vn: 'Mèo con', icon: '🐱' }            ],            
            dialogue: {              
              avatar: '🪁',              
              title: 'Sân Sau Nhà',              
              steps: [                
                {                  
                  botText: "Is she flying a kite?",                  
                  botVn: "Cậu ấy đang thả diều phải không?",                  
                  targetPhrase: "Yes she is",                  
                  targetVn: "Vâng, đúng vậy!"                }              ]            },            
            sentenceQuiz: [              
              { id: 'sq2', fullSentence: "Is she flying a kite", vn: "Cậu ấy đang thả diều phải không", words: ["Is", "she", "flying", "a", "kite"] }            ]          }
        ];

        // Component chính của ứng dụng
        function App() {
          const [currentView, setCurrentView] = useState('home');
          const [selectedUnit, setSelectedUnit] = useState(null);
          const [score, setScore] = useState(10);

          return (
            <div className="flex flex-col min-h-full bg-sky-100 text-slate-800">
              {/* Header */}
              <header className="bg-gradient-to-r from-indigo-600 to-sky-600 text-white p-4 shadow-md sticky top-0 z-40 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <span className="text-2xl">🌟</span>
                  <div>
                    <h1 className="font-bold text-lg leading-tight">Kids English Explorer</h1>
                    <p className="text-xs text-sky-200">Global Success Grade 2</p>
                  </div>
                </div>
                <div className="bg-amber-400 text-amber-950 font-bold px-3 py-1 rounded-full text-sm shadow flex items-center gap-1">
                  ⭐ <span>{score}</span>
                </div>
              </header>

              {/* Nội dung chính */}
              <main className="flex-1 p-4 pb-20">
                {currentView === 'home' && (
                  <div>
                    <div className="bg-gradient-to-r from-amber-500 to-orange-500 text-white p-4 rounded-2xl shadow-md mb-6">
                      <h2 className="text-xl font-black mb-1">Chào bé yêu! 🎒</h2>
                      <p className="text-sm opacity-90">Hãy chọn Unit để bắt đầu khám phá tiếng Anh lớp 2 vui nhộn nhé!</p>
                    </div>

                    <div className="grid grid-cols-1 gap-3">
                      {GLOBAL_SUCCESS_TOPICS.map((unit) => (
                        <div 
                          key={unit.id}
                          onClick={() => { setSelectedUnit(unit); setCurrentView('unit_detail'); }}
                          className={`bg-white border-2 ${unit.borderColor} p-4 rounded-2xl shadow-sm hover:shadow-md transition cursor-pointer flex items-center gap-4`}
                        >
                          <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${unit.color} flex items-center justify-center text-2xl shadow`}>
                            {unit.icon}
                          </div>
                          <div className="flex-1">
                            <h3 className="font-bold text-slate-800 text-base">{unit.title}</h3>
                            <p className="text-xs text-slate-500">{unit.subtitle}</p>
                          </div>
                          <div className="text-slate-400 font-bold text-lg">›</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {currentView === 'unit_detail' && selectedUnit && (
                  <div>
                    <button 
                      onClick={() => setCurrentView('home')} 
                      className="mb-4 text-sm font-bold text-indigo-600 flex items-center gap-1 hover:underline"
                    >
                      ← Quay lại danh sách Unit
                    </button>

                    <div className={`bg-gradient-to-br ${selectedUnit.color} text-white p-6 rounded-3xl shadow-lg mb-6`}>
                      <div className="text-4xl mb-2">{selectedUnit.icon}</div>
                      <h2 className="text-2xl font-black">{selectedUnit.title}</h2>
                      <p className="text-sm opacity-90 mt-1">{selectedUnit.subtitle}</p>
                    </div>

                    <div className="bg-white p-5 rounded-2xl shadow-sm mb-4">
                      <h3 className="font-bold text-indigo-900 mb-2 flex items-center gap-2">📖 Tổng quan bài học</h3>
                      <p className="text-sm text-slate-600 mb-3">{selectedUnit.lesson.summary}</p>
                      <div className="bg-sky-50 p-3 rounded-xl border border-sky-200">
                        <span className="text-xs font-bold text-sky-700 block uppercase">Mẫu câu trọng tâm:</span>
                        <span className="text-sm font-semibold text-sky-900">{selectedUnit.lesson.keyGrammar}</span>
                      </div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl shadow-sm
